<!DOCTYPE html>
<html lang="uz">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirchiq Manzillar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .footer { background-color: #212529; color: white; padding: 20px 0; margin-top: 50px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        
        <div style="width: 120px;">
            {% if request.path != '/' %}
            <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left"></i> Orqaga
            </a>
            {% endif %}
        </div>

        <a class="navbar-brand m-0" href="/">
            Chirchiq Manzillar
        </a>

        <div style="width: 120px;"></div>
        
    </div>
</nav>

<div class="container" style="min-height: 70vh;">
    {% block content %}{% endblock %}
</div>

<footer class="footer">
    <div class="container text-center">
        <p class="mb-0">© 2026 Chirchiq Manzillar</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
