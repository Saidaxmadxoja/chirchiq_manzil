services:
  web:
    build: .
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chirchiq_db
      - POSTGRES_USER=chirchiq_user
      - POSTGRES_PASSWORD=password123

volumes:
  postgres_data:
  static_volume:
  media_volume: